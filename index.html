<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperCart Brasil - Grupo de Pontos</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
        .card { 
            text-align: center; 
            width: 88%; 
            max-width: 350px; 
            background: white; 
            padding: 40px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-sizing: border-box;
        }
        .icon { width: 65px; height: 65px; background: #FFD700; color: #b8860b; font-size: 35px; line-height: 65px; border-radius: 50%; margin: 0 auto 20px; display: block; font-weight: bold; }
        .title { font-size: 20px; font-weight: bold; margin-bottom: 12px; color: #1c1e21; width: 100%; }
        .text { font-size: 15px; color: #606770; line-height: 1.5; margin-bottom: 30px; width: 100%; box-sizing: border-box; }
        .btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #25D366; 
            color: white; 
            text-decoration: none; 
            padding: 16px; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 17px; 
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); 
            border: none; 
            width: 100%;            
            max-width: 280px;      
            margin: 0 auto;        
            cursor: pointer; 
            box-sizing: border-box; 
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">P</div>
        <div class="title">Grupo de Pontos Aberto!</div>
        <div class="text">
            Sua vaga no grupo <b>SuperCart</b> foi reservada. Complete o grupo agora para ganhar o dobro de pontos e trocar por <b>Reais (BRL)</b> via Pix!
        </div>
        <!-- 巴西专用分流短链 -->
        <a href="https://lihi2.me/x566o" class="btn">QUERO MEU LUCRO AGORA</a>
    </div>
</body>
</html>
